<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Rooster</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.rooster{
    display:grid;
    grid-template-columns:80px repeat(5,1fr);
    min-height:700px;
}

.kop{
    background:#111827;
    padding:15px;
    text-align:center;
    border:1px solid #374151;
}

.tijd{
    border:1px solid #374151;
    padding-top:40px;
    text-align:center;
    color:#94a3b8;
}

.dag{
    position:relative;
    border:1px solid #374151;
}

.les{
    position:absolute;
    left:5px;
    right:5px;
    border-radius:12px;
    padding:10px;
    color:white;
    overflow:hidden;
}

.oranje{
    background:#7c3f15;
}

.blauw{
    background:#1e3a5f;
}

.vak{
    font-size:24px;
    font-weight:bold;
}

.lokaal{
    margin-top:5px;
    font-size:20px;
}
</style>
</head>
<body>

<header>Mijn Rooster</header>

<div class="rooster">

<div class="kop"></div>
<div class="kop">Ma</div>
<div class="kop">Di</div>
<div class="kop">Wo</div>
<div class="kop">Do</div>
<div class="kop">Vr</div>

<div class="tijd">08:00</div>
<div class="dag" id="ma"></div>
<div class="dag" id="di"></div>
<div class="dag" id="wo"></div>
<div class="dag" id="do"></div>
<div class="dag" id="vr"></div>

</div>

<script>

const lessen = [

{
dag:"ma",
vak:"NE",
lokaal:"G102",
start:9,
eind:10,
kleur:"oranje"
},

{
dag:"ma",
vak:"BI",
lokaal:"B207",
start:10,
eind:11,
kleur:"oranje"
},

{
dag:"di",
vak:"WI",
lokaal:"F008",
start:9,
eind:10,
kleur:"oranje"
},

{
dag:"wo",
vak:"FA",
lokaal:"D106",
start:9,
eind:10,
kleur:"blauw"
},

{
dag:"do",
vak:"BI",
lokaal:"D009",
start:9,
eind:10,
kleur:"blauw"
},

{
dag:"vr",
vak:"WI",
lokaal:"D009",
start:9,
eind:10,
kleur:"blauw"
}

];

lessen.forEach(les => {

const blok = document.createElement("div");

blok.className = "les " + les.kleur;

const top = (les.start - 8) * 100;
const hoogte = (les.eind - les.start) * 100 - 5;

blok.style.top = top + "px";
blok.style.height = hoogte + "px";

blok.innerHTML = `
<div class="vak">${les.vak}</div>
<div class="lokaal">${les.lokaal}</div>
`;

document.getElementById(les.dag).appendChild(blok);

});

</script>

</body>
</html>
