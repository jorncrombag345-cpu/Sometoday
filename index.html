<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Schoolportaal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: white;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<header>
    <h1>Mijn Schoolportaal</h1>
    <p>Rooster, afwezigheid en cijfers</p>
</header>

<nav>
    <a href="#">Dashboard</a>
    <a href="#">Rooster</a>
    <a href="#">Afwezigheid</a>
    <a href="#">Cijfers</a>
</nav>

<div class="container">

    <div class="card">
        <h2>Welkom</h2>
        <p>Welkom op je schoolportaal.</p>
    </div>

    <div class="card">
        <h2>Volgende les</h2>
        <p>Nederlands - 09:00</p>
    </div>

</div>

</body>
</html>
